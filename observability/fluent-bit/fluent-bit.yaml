# Ships every Compose container's logs to VictoriaLogs.
#
# Reads Docker's json-file logs from the host read-only, so it needs no access to the
# Docker socket (which would be root on the host). docker_metadata.lua names each line's
# Compose service and drops lines from other projects' containers.
service:
  flush: 2
  log_level: warn
  http_server: off

parsers:
  - name: json
    format: json

pipeline:
  inputs:
    - name: tail
      path: ${DOCKER_CONTAINERS_DIR}/*/*-json.log
      tag: docker.*
      # Docker's JSON wrapper, with long lines that Docker split joined back up
      multiline.parser: docker
      # Remembers how far each file was read, so a restart neither repeats nor skips lines
      db: /fluent-bit/state/tail.db
      # From the end on first start: older lines are already in `docker compose logs`
      read_from_head: false
      refresh_interval: 10
      # Pauses reading rather than buffering more than this while VictoriaLogs is down
      mem_buf_limit: 8MB
      buffer_max_size: 256k
      skip_long_lines: on

  filters:
    # The Java services' ECS lines and the auth service's JSON lines become fields; other
    # lines (Kafka, Postgres) are left as text
    - name: parser
      match: docker.*
      key_name: log
      parser: json
      reserve_data: on

    - name: lua
      match: docker.*
      script: /fluent-bit/etc/docker_metadata.lua
      call: enrich

  outputs:
    - name: http
      match: docker.*
      host: victorialogs
      port: 9428
      uri: /insert/jsonline?_stream_fields=service&_msg_field=message&_time_field=date
      format: json_lines
      json_date_key: date
      json_date_format: iso8601
      retry_limit: 5
