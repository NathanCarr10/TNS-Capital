spring:
  application:
    name: tns-capital-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tns_capital}
    username: ${SPRING_DATASOURCE_USERNAME:tns-capital-db-user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      # The db/ image owns the schema; Hibernate only checks the entities match it
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 10
          fetch_size: 50
    show-sql: false
    open-in-view: false

  # Outbound REST calls (the Alpaca market data API) must not hang an order request
  http:
    client:
      connect-timeout: 5s
      read-timeout: 5s

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      enable-idempotence: true
      properties:
        linger.ms: 10
        batch.size: 32768
        # Fail a send within 5 s when Kafka is unreachable (default 60 s), so
        # placing an order cannot hang
        max.block.ms: 5000
    consumer:
      bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      group-id: tns-capital-orders
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

trading:
  kafka:
    topics:
      orders: orders
      trade-events: trade-events
      market-data: market-data
    # How long placing an order waits for Kafka to acknowledge it
    send-timeout-ms: 5000

broker:
  # The Broker Simulator API the Trade Executor sends orders to
  url: ${BROKER_URL:http://localhost:8085}
  timeout-ms: 3000

market-data:
  alpaca:
    # Without both keys the live price pool is off and orders must include a price
    key-id: ${ALPACA_API_KEY_ID:}
    secret-key: ${ALPACA_API_SECRET_KEY:}
    # iex is the free plan's real-time feed; sip (all US exchanges) needs a paid plan
    feed: ${ALPACA_FEED:iex}
    stream-url: wss://stream.data.alpaca.markets/v2/
    data-url: https://data.alpaca.markets
    # The free plan streams at most 30 symbols; the rest are priced over REST
    max-symbols: 30
    # A pooled price not updated for this long is refreshed over REST before use
    max-price-age: 60s

newsletter:
  # Fridays at 17:00 New York time, after the US market closes. NEWSLETTER_CRON=- switches it off
  cron: ${NEWSLETTER_CRON:0 0 17 * * FRI}
  zone: America/New_York
  movers-per-side: 5
  headlines-per-mover: 3
  # Lets support staff publish the week's issue before Friday, e.g. for a demo. The Friday run then skips
  # that week, so keep it off in production. NEWSLETTER_EARLY_PUBLISH=true switches it on
  early-publish: ${NEWSLETTER_EARLY_PUBLISH:false}

dlq:
  auto-resolve:
    # PENDING DLQ messages are marked RESOLVED once older than after-ms. Off: a failed order
    # stays PENDING until an admin reviews or replays it (OWASP A09-4). DLQ_AUTO_RESOLVE=true
    # turns it back on, e.g. for a demo.
    enabled: ${DLQ_AUTO_RESOLVE:false}
    after-ms: 10000
    interval-ms: 1000

jwt:
  # Must match the auth service. Set JWT_SECRET in the environment; there is no default.
  shared-secret: ${JWT_SECRET}
  # Tokens must carry this iss claim; must match the auth service's JWT_ISSUER
  issuer: urn:tns-capital:auth-service

mybatis:
  type-handlers-package: com.neueda.leap.config
  type-aliases-package: com.neueda.leap.model
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # /actuator/health is public (SecurityConfig): anyone gets UP or DOWN,
      # only admins get the database and disk details
      show-details: when-authorized
      roles: ADMIN
  health:
    db:
      enabled: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    path: /v3/api-docs
    # The Angular client generator's OpenAPI 3.1 support is beta; 3.0 also matches contracts/auth-api.yaml
    version: openapi_3_0
  # Without this the spec lists responses as */*, and the generated Angular
  # clients then read them as Blobs instead of JSON models
  default-produces-media-type: application/json

# DEBUG for these packages logs every request and Kafka poll; enable it per run
# when needed, e.g. LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA=DEBUG
logging:
  level:
    com.neueda.leap: INFO
