spring:
    application:
        name: tns-capital-api
    datasource:
        url: jdbc:postgresql://localhost:5432/tns_capital
        username: ${DB_USER:-tns-capital-db-user}
        password: ${DB_PASSWORD:?set DB_PASSWORD in .env}
        driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.neueda.leap.model
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 3000

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs