spring:
  application:
    name: tns-capital-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tns_capital}
    username: ${SPRING_DATASOURCE_USERNAME:tns-capital-db-user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      # The db/ image owns the schema; Hibernate only checks the entities match it
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 10
          fetch_size: 50
    show-sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      enable-idempotence: true
      properties:
        linger.ms: 10
        batch.size: 32768
    consumer:
      bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      group-id: tns-capital-orders
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

trading:
  kafka:
    topics:
      orders: orders
      trade-events: trade-events
      market-data: market-data

jwt:
  # Must match the auth service. Set JWT_SECRET in the environment; there is no default.
  shared-secret: ${JWT_SECRET}

mybatis:
  type-handlers-package: com.neueda.leap.config
  type-aliases-package: com.neueda.leap.model
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    path: /v3/api-docs

# DEBUG for these packages logs every request and Kafka poll; enable it per run
# when needed, e.g. LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA=DEBUG
logging:
  level:
    com.neueda.leap: INFO
