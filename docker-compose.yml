services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    mem_limit: 256m
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    # Infrastructure ports are for tools on this machine only (OWASP A05-2)
    ports:
      - "127.0.0.1:2181:2181"
    healthcheck:
      test: ["CMD", "echo", "stat", "|", "nc", "localhost", "2181"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    mem_limit: 1g
    # Only this machine: anyone who can produce to the orders topic can trade on any account
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    build: ./db
    mem_limit: 512m
    environment:
      POSTGRES_DB: tns_capital
      POSTGRES_USER: ${DB_USER:-tns-capital-db-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_USER: ${DB_USER:-tns-capital-db-user}
      # Passwords of the services' own login roles (db/roles/roles.sql), set when
      # the database is created; each defaults to DB_PASSWORD
      DB_API_PASSWORD: ${DB_API_PASSWORD:-${DB_PASSWORD}}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:-${DB_PASSWORD}}
      DB_ETL_PASSWORD: ${DB_ETL_PASSWORD:-${DB_PASSWORD}}
      DB_READER_PASSWORD: ${DB_READER_PASSWORD:-${DB_PASSWORD}}
    ports:
      - "127.0.0.1:5432:5432"
    command:
      - "-c"
      - "max_connections=30"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "work_mem=8MB"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h localhost checks over TCP, which only opens once the init SQL has finished
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${DB_USER:-tns-capital-db-user} -d tns_capital"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./shared/auth-service
    mem_limit: 256m
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # The admin account is created from this at startup; nothing is seeded (OWASP A07-4)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (at least 12 characters)}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tns_capital
      # Least-privilege role: users, refresh tokens, opening accounts (db/roles/roles.sql)
      DB_USER: tns_auth
      DB_PASSWORD: ${DB_AUTH_PASSWORD:-${DB_PASSWORD}}
      PORT: 4000
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      # Proxies whose X-Forwarded-For gives the client IP: nginx on the Docker network
      AUTH_TRUST_PROXY: ${AUTH_TRUST_PROXY:-loopback, uniquelocal}
    # Localhost only: browsers reach it through the frontend's /auth/ proxy
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  broker-simulator:
    build: ./broker-simulator
    mem_limit: 384m
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BROKER_MIN_DELAY: ${BROKER_MIN_DELAY:-500ms}
      BROKER_MAX_DELAY: ${BROKER_MAX_DELAY:-2000ms}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-ecs}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    # No host port: the broker has no authentication, so only the API can reach it
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    mem_limit: 512m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tns_capital
      # Least-privilege role: the trading tables only (db/roles/roles.sql)
      SPRING_DATASOURCE_USERNAME: tns_api
      SPRING_DATASOURCE_PASSWORD: ${DB_API_PASSWORD:-${DB_PASSWORD:?set DB_PASSWORD in .env}}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BROKER_URL: http://broker-simulator:8085
      # One JSON object per log line (Elastic Common Schema), for log tools to parse
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-ecs}
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
      ALPACA_FEED: ${ALPACA_FEED:-iex}
      # When the weekly newsletter is published (Spring cron, New York time); - switches it off
      NEWSLETTER_CRON: ${NEWSLETTER_CRON:-0 0 17 * * FRI}
      # Lets admins publish the week's issue before Friday (demos); off unless set to true
      NEWSLETTER_EARLY_PUBLISH: ${NEWSLETTER_EARLY_PUBLISH:-false}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:MaxHeapSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps
    # Localhost only: browsers reach it through the frontend's /api/ proxy
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      broker-simulator:
        condition: service_healthy
    healthcheck:
      # /actuator/health is public and answers UP or DOWN without details
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      # The API clients are generated from the specs in contracts/ during the build
      additional_contexts:
        contracts: ./contracts
    mem_limit: 64m
    ports:
      - "${FRONTEND_PORT:-8086}:8080"
    depends_on:
      app:
        condition: service_started
      auth-service:
        condition: service_healthy
      # nginx forwards /analytics/ to it, and won't start if it can't resolve the name
      dashboard:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  etl:
    build: ./etl
    mem_limit: 384m
    environment:
      ETL_DB_HOST: postgres
      # Least-privilege role: reads the trading tables, owns the analytics schema
      DB_USER: tns_etl
      DB_PASSWORD: ${DB_ETL_PASSWORD:-${DB_PASSWORD:?set DB_PASSWORD in .env}}
      ETL_SCHEDULE_TIME: ${ETL_SCHEDULE_TIME:-02:00}
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
      PRICE_HISTORY_FEED: ${PRICE_HISTORY_FEED:-sip}
      PRICE_BACKFILL_YEARS: ${PRICE_BACKFILL_YEARS:-5}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    mem_limit: 384m
    environment:
      DASHBOARD_DB_HOST: postgres
      # Least-privilege role: read only (db/roles/roles.sql)
      DB_USER: tns_reader
      DB_PASSWORD: ${DB_READER_PASSWORD:-${DB_PASSWORD:?set DB_PASSWORD in .env}}
      DASHBOARD_AUTH_URL: http://auth-service:4000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    # Localhost only: browsers reach it through the frontend's /analytics/ proxy,
    # which also adds the security headers
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl or wget; Streamlit serves its health check under the base path
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/analytics/_stcore/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    mem_limit: 384m
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: trading-platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # Browse only: it has no login, and producing to orders would bypass account ownership
      # (OWASP A05-1, A01-5)
      KAFKA_CLUSTERS_0_READONLY: "true"
      JAVA_OPTS: -XX:MaxRAMPercentage=70
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8090}:8080"
    restart: unless-stopped

volumes:
  pgdata: