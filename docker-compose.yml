services:
    postgres:
      image: postgres:16
      environment:
        POSTGRES_DB: tns_capital
        POSTGRES_USER: ${DB_USER:-tns-capital-db-user}
        POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tns-capital-db-user} -d tns_capital"]
        interval: 5s
        timeout: 5s
        retries: 5

volumes:
  pgdata:

