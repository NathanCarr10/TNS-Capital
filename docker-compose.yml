services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "echo", "stat", "|", "nc", "localhost", "2181"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    build: ./db
    environment:
      POSTGRES_DB: tns_capital
      POSTGRES_USER: ${DB_USER:-tns-capital-db-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_USER: ${DB_USER:-tns-capital-db-user}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h localhost checks over TCP, which only opens once the init SQL has finished
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${DB_USER:-tns-capital-db-user} -d tns_capital"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-stub:
    build:
      context: ./shared/auth-stub
      args:
        DB_HOST: postgres
        DB_PORT: 5432
        DB_NAME: tns_capital
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        JWT_SECRET: ${JWT_SECRET}
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tns_capital
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-tns-capital-db-user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      auth-stub:
        condition: service_healthy
      kafka:
        condition: service_healthy

  etl:
    build: ./etl
    environment:
      ETL_DB_HOST: postgres
      DB_USER: ${DB_USER:-tns-capital-db-user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      ETL_SCHEDULE_TIME: ${ETL_SCHEDULE_TIME:-02:00}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: trading-platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    restart: unless-stopped

volumes:
  pgdata: