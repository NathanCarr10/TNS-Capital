<!-- The live region stays in the page so screen readers announce each toast as it is added -->
<section class="toasts" aria-live="polite" aria-label="Notifications">
  @for (item of toast.toasts(); track item.id) {
    <div
      class="toast"
      [class]="item.kind"
      [attr.role]="item.kind === 'error' ? 'alert' : 'status'"
      (mouseenter)="toast.pause(item.id)"
      (mouseleave)="toast.resume(item.id)"
      (focusin)="toast.pause(item.id)"
      (focusout)="toast.resume(item.id)"
    >
      <app-icon class="kind-icon" [name]="item.kind" />
      <p class="message">{{ item.message }}</p>
      <button type="button" class="close" aria-label="Dismiss notification" (click)="toast.dismiss(item.id)">
        <app-icon name="close" />
      </button>
    </div>
  }
</section>
