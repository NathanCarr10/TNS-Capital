@if (headlines().length > 0) {
  <section class="news" [attr.aria-label]="'Latest news about ' + symbol()">
    <h2 class="label">News</h2>

    <div class="viewport">
      <div class="track" [style.--news-duration]="duration()">
        @for (copy of copies; track copy) {
          <ul class="cards" [attr.aria-hidden]="copy > 0 ? 'true' : null">
            @for (item of headlines(); track item.url) {
              <li>
                <!-- Third-party text: interpolated, so it is shown as text and never run as HTML -->
                <a
                  class="news-card"
                  [href]="item.url"
                  target="_blank"
                  rel="noopener noreferrer"
                  [attr.tabindex]="copy > 0 ? -1 : null"
                >
                  <span class="meta">
                    {{ item.source }}
                    @if (item.publishedAt) {
                      &middot; {{ item.publishedAt | date: 'MMM d, HH:mm' }}
                    }
                  </span>
                  <span class="headline">{{ item.headline }}</span>
                </a>
              </li>
            }
          </ul>
        }
      </div>
    </div>
  </section>
}
