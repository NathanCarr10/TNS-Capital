<section class="home-page">
  <header class="home-header">
    <h1>TNS Capital</h1>
    <p>Professional trading made simple.</p>
  </header>

  <a class="trader-entry" routerLink="/login">
    <div class="trader-copy">
      <h2>Trading Portal</h2>
      <p>Execute orders, monitor real-time market activity, and manage portfolio performance.</p>
    </div>
    <span class="home-action">Sign In to Trade <span aria-hidden="true">&rarr;</span></span>
  </a>

  <div class="admin-access">
    <span>Operations access</span>
    <a [href]="analyticsDashboardUrl">Open admin analytics</a>
  </div>
</section>
