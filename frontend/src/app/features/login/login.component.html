<section class="login-page">
  <div class="login-card">
    <img class="auth-logo logo-adaptive" src="brand/TNS_Capital_stacked_transparent.png" alt="TNS Capital" />
    <h1>Welcome Back</h1>
    <p>Sign in to access your account and trading tools.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="Enter email"
      />

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        placeholder="Enter password"
      />

      <!-- One line is always reserved here, so the form keeps its size when a message appears -->
      <div class="form-message" aria-live="polite">
        @if (loginForm.invalid && loginForm.touched) {
          <p class="field-error">Email and password are required.</p>
        } @else if (errorMessage()) {
          <p class="server-error">{{ errorMessage() }}</p>
        }
      </div>

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Signing In...' : 'Login' }}
      </button>
    </form>

    <p class="auth-link">New to TNS Capital? <a routerLink="/register">Create an account</a></p>
    <a class="back-link" href="/">&larr; Back to home</a>
  </div>
</section>
