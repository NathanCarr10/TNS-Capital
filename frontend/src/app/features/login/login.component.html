<section class="login-page">
  <div class="login-card">
    <img class="auth-logo" src="brand/company-logo.png" alt="TNS Capital" />
    <h1>Welcome Back</h1>
    <p>Sign in to access your account and trading tools.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="Enter email"
      />

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        placeholder="Enter password"
      />

      <p class="field-error" [class.visible]="loginForm.invalid && loginForm.touched">
        Email and password are required.
      </p>

      <p class="server-error" [class.visible]="!!errorMessage()">{{ errorMessage() }}</p>

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Signing In...' : 'Login' }}
      </button>
    </form>

    <p class="auth-link">New to TNS Capital? <a routerLink="/register">Create an account</a></p>
    <a class="back-link" href="/">&larr; Back to home</a>
  </div>
</section>
