<div
  class="side-toggle"
  [class.sell]="value() === 'SELL'"
  role="radiogroup"
  [attr.aria-labelledby]="labelledBy()"
>
  @for (side of sides; track side) {
    <button
      type="button"
      role="radio"
      [class.selected]="value() === side"
      [attr.aria-checked]="value() === side"
      [disabled]="disabled()"
      (click)="select(side)"
      (blur)="markTouched()"
    >
      {{ side }}
    </button>
  }
</div>
