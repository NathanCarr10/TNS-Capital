# Included in every location that sets its own add_header, because nginx drops
# server-level add_header lines in any location that has one.
#
# The Content-Security-Policy is a second line of defence against XSS: even if
# markup got into the page, the browser only runs scripts served by this origin.
# - script-src: the one inline handler allowed is Angular's stylesheet loader,
#   onload="this.media='all'" in index.html, pinned by its hash.
# - style-src 'unsafe-inline': Angular adds component styles as <style> tags.
# - fonts.googleapis.com / fonts.gstatic.com: the Space Grotesk font in styles.scss.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
