# Same routing as proxy.conf.json does for `ng serve`: the app calls /api and
# /auth on its own origin, and nginx forwards them inside the Compose network.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://auth-service:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The admin analytics dashboard (Streamlit, served under /analytics/). Streamlit talks to
    # the browser over a WebSocket, so the upgrade headers are passed on and idle sockets kept open.
    # ^~ so the .js/.css rule below doesn't take Streamlit's own scripts and look for them here.
    location ^~ /analytics/ {
        proxy_pass http://dashboard:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # With the port: Streamlit rejects a WebSocket whose Origin doesn't match the Host
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Hashed bundles never change, so browsers can keep them
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/dashboard, /symbols/AAPL, ...) all load index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
